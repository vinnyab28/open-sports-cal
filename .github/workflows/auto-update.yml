name: Auto-update Sports Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update leagues
        run: |
          failed=""
          for league in nba nhl nfl mlb pwhl epl la_liga bundesliga serie_a ligue_1 f1; do
            echo "::group::Update $league"
            if ! python3 "scripts/update_${league}.py"; then
              echo "::warning::update_${league}.py failed — continuing with other leagues"
              failed="$failed $league"
            fi
            echo "::endgroup::"
          done
          echo "FAILED_LEAGUES=$failed" >> "$GITHUB_ENV"

      - name: Validate
        run: python3 validate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: auto-update schedules [skip ci]"
          git push

      - name: Fail if any league update failed
        if: env.FAILED_LEAGUES != ''
        run: |
          echo "::error::League update script(s) failed:${FAILED_LEAGUES}"
          exit 1
